name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint / Check
        run: pnpm exec biome check

      - name: Check types
        run: pnpm run typecheck

      - name: Test with coverage
        id: coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Check build
        run: pnpm run build

      # Check that the build output still seems correct and ready for publishing
      - name: Publint
        run: pnpm run lint:package

      - name: Check unused files, dependencies, etc.
        run: pnpm run knip
